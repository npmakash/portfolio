<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="14" stroke-opacity="0.6" />

  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 170 160 L 90 256 L 170 352" fill="none" stroke="url(#brandGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M 285 130 L 227 382" fill="none" stroke="#06b6d4" stroke-width="40" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 342 160 L 422 256 L 342 352" fill="none" stroke="url(#brandGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>